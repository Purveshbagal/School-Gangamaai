name: Deploy Gangamaai School to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 15m
          script: |
            cd /var/www/gangamaaischool
            git remote set-url origin https://rushiravtale:${{ secrets.GIT_TOKEN }}@github.com/Purveshbagal/School-Gangamaai.git
            git fetch origin
            git reset --hard origin/main
            cat > .env << 'EOF'
            DATABASE_URL="mongodb://127.0.0.1:27017/school-Gangamaai?directConnection=true"
            NODE_ENV=production
            PORT=9698
            COOKIE_SECURE=false
            ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            EOF
            npm ci --legacy-peer-deps
            rm -rf .next/
            npm run build
            pm2 restart gangamaaischool --update-env || PORT=9698 pm2 start npm --name "gangamaaischool" -- start
            pm2 save
            echo "✅ Gangamaai School Deploy successful!"
